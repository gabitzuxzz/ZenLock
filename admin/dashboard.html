<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ZenLock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #065f46 0%, #047857 100%);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Discord Link -->
    <div class="absolute top-4 right-4 z-10">
        <a href="https://discord.gg/zenyth" target="_blank" 
           class="flex items-center justify-center w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full transition-all duration-300 backdrop-blur-sm">
            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.010c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.197.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418Z"/>
            </svg>
        </a>
    </div>

    <!-- Logout Button -->
    <div class="absolute top-4 left-4 z-10">
        <button onclick="logout()" 
                class="flex items-center justify-center w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full transition-all duration-300 backdrop-blur-sm">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
        </button>
    </div>

    <!-- Main Content -->
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="max-w-2xl w-full">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto mb-4 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                </div>
                <h1 class="text-4xl font-bold text-white mb-2">Admin Dashboard</h1>
                <p class="text-green-100">Create secure pastes</p>
            </div>

            <!-- Create Paste Form -->
            <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8">
                <h2 class="text-2xl font-semibold text-gray-800 mb-6">Create New Paste</h2>
                
                <form id="createPasteForm" class="space-y-6">
                    <div>
                        <label for="title" class="block text-sm font-medium text-gray-700 mb-2">Title</label>
                        <input type="text" id="title" name="title" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-300"
                               placeholder="Enter paste title">
                    </div>

                    <div>
                        <label for="content" class="block text-sm font-medium text-gray-700 mb-2">Content</label>
                        <textarea id="content" name="content" required rows="8"
                                  class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-300 resize-vertical"
                                  placeholder="Enter your content here..."></textarea>
                    </div>

                    <div>
                        <label for="pastePassword" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" id="pastePassword" name="password" required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-300"
                               placeholder="Enter password to protect this paste">
                        <p class="text-xs text-gray-500 mt-1">Users will need this password to view the paste</p>
                    </div>

                    <button type="submit" id="createBtn"
                            class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-300 flex items-center justify-center">
                        <span id="createBtnText">Create Paste</span>
                        <div id="createSpinner" class="hidden ml-2">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </div>
                    </button>
                </form>

                <!-- Success Message -->
                <div id="successMessage" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded-lg">
                    <div class="flex">
                        <svg class="w-5 h-5 text-green-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <div class="text-sm text-green-700">
                            <p class="font-semibold">Paste created successfully!</p>
                            <p class="mt-1">Share this link: <span id="pasteLink" class="font-mono break-all"></span></p>
                            <button onclick="copyPasteLink()" 
                                    class="mt-2 px-3 py-1 bg-green-600 text-white text-xs rounded hover:bg-green-700 transition-colors">
                                Copy Link
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden mt-6 p-4 bg-red-50 border border-red-200 rounded-lg">
                    <div class="flex">
                        <svg class="w-5 h-5 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <p class="text-sm text-red-700" id="errorText"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        if (!localStorage.getItem('zenlock_admin') || !localStorage.getItem('zenlock_token')) {
            window.location.href = '/admin/login';
        }

        // Logout function
        function logout() {
            localStorage.removeItem('zenlock_admin');
            localStorage.removeItem('zenlock_token');
            window.location.href = '/admin/login';
        }

        // Copy paste link to clipboard
        function copyPasteLink() {
            const link = document.getElementById('pasteLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                // Show feedback (you could add a toast notification here)
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                setTimeout(() => {
                    button.textContent = originalText;
                }, 2000);
            });
        }

        // Handle create paste form submission
        document.getElementById('createPasteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const password = document.getElementById('pastePassword').value;
            
            const createBtn = document.getElementById('createBtn');
            const createBtnText = document.getElementById('createBtnText');
            const createSpinner = document.getElementById('createSpinner');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            const pasteLink = document.getElementById('pasteLink');

            // Show loading state
            createBtn.disabled = true;
            createBtnText.textContent = 'Creating...';
            createSpinner.classList.remove('hidden');
            successMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');

            try {
                // Get authentication token
                const token = localStorage.getItem('zenlock_token');
                if (!token) {
                    window.location.href = '/admin/login';
                    return;
                }

                // Replace with your backend URL when deploying
                const response = await fetch('/api/createPaste', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`,
                    },
                    body: JSON.stringify({ title, content, password }),
                });

                const data = await response.json();

                if (data.success) {
                    // Show success message with link
                    const currentUrl = window.location.origin;
                    const fullLink = `${currentUrl}/view/${data.id}`;
                    pasteLink.textContent = fullLink;
                    successMessage.classList.remove('hidden');
                    
                    // Reset form
                    document.getElementById('createPasteForm').reset();
                } else {
                    // Check if authentication error
                    if (response.status === 401) {
                        // Clear tokens and redirect to login
                        localStorage.removeItem('zenlock_admin');
                        localStorage.removeItem('zenlock_token');
                        window.location.href = '/admin/login';
                        return;
                    }
                    
                    // Show error
                    errorText.textContent = data.message || 'Failed to create paste';
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Create paste error:', error);
                errorText.textContent = 'Connection error. Please try again.';
                errorMessage.classList.remove('hidden');
            } finally {
                // Reset loading state
                createBtn.disabled = false;
                createBtnText.textContent = 'Create Paste';
                createSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
