<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenLock - Secure Paste Sharing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #065f46 0%, #047857 100%);
            animation: gradientShift 8s ease-in-out infinite alternate;
        }
        
        @keyframes gradientShift {
            0% { background: linear-gradient(135deg, #065f46 0%, #047857 100%); }
            100% { background: linear-gradient(135deg, #047857 0%, #059669 100%); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-pulse-soft { animation: pulse 3s ease-in-out infinite; }
        .animate-slide-up { animation: slideInUp 0.8s ease-out; }
        .animate-fade-in { animation: fadeIn 1s ease-out; }
        
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .glow {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }
        
        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3), 0 0 20px rgba(16, 185, 129, 0.2);
        }
        
        .btn-glow:hover {
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Discord Link -->
    <div class="absolute top-4 right-4 z-10 animate-fade-in">
        <a href="https://discord.gg/zenyth" target="_blank" 
           class="flex items-center justify-center w-12 h-12 glass rounded-full transition-all duration-300 hover:scale-110 glow">
            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.010c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.197.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418Z"/>
            </svg>
        </a>
    </div>

    <!-- Admin Link (Hidden) -->
    <div class="absolute bottom-4 left-4 z-10">
        <a href="/admin/login" 
           class="flex items-center justify-center w-10 h-10 glass rounded-full transition-all duration-300 hover:scale-110 opacity-30 hover:opacity-80">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </a>
    </div>

    <!-- Main Content -->
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="max-w-2xl w-full">
            <!-- Logo/Brand -->
            <div class="text-center mb-12 animate-slide-up">
                <div class="w-24 h-24 mx-auto mb-6 glass rounded-full flex items-center justify-center animate-float glow">
                    <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h1 class="text-5xl font-bold text-white mb-4 animate-pulse-soft">ZenLock</h1>
                <p class="text-xl text-green-100 animate-fade-in">Secure paste sharing made simple</p>
            </div>

            <!-- Access Paste Card -->
            <div class="glass rounded-3xl shadow-2xl p-8 mb-8 animate-slide-up glow">
                <h2 class="text-3xl font-semibold text-white mb-8 text-center">Access Your Paste</h2>
                
                <form id="accessForm" class="space-y-6">
                    <div>
                        <label for="pasteInput" class="block text-lg font-medium text-white mb-3">
                            Paste ID or Full URL
                        </label>
                        <input type="text" id="pasteInput" name="pasteInput" 
                               class="w-full px-6 py-4 bg-white/10 border-2 border-white/20 rounded-2xl focus:border-green-400 focus:outline-none transition-all duration-300 text-white placeholder-white/60 text-lg input-glow"
                               placeholder="Enter paste ID (e.g., abc123xyz) or full URL">
                        <p class="text-white/70 text-sm mt-2">
                            💡 You can paste either the paste ID or the complete ZenLock URL
                        </p>
                    </div>

                    <button type="submit" id="accessBtn"
                            class="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-4 px-8 rounded-2xl transition-all duration-300 text-lg btn-glow transform hover:scale-105">
                        <span id="accessBtnText">🔓 Access Paste</span>
                        <div id="accessSpinner" class="hidden inline-block ml-2">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </div>
                    </button>
                </form>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden mt-6 p-4 bg-red-500/20 border border-red-400/30 rounded-2xl backdrop-blur-sm">
                    <div class="flex items-center">
                        <svg class="w-5 h-5 text-red-300 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <p class="text-red-100" id="errorText"></p>
                    </div>
                </div>
            </div>

            <!-- Features -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 animate-fade-in">
                <div class="glass rounded-2xl p-6 text-center transform hover:scale-105 transition-all duration-300">
                    <div class="w-12 h-12 mx-auto mb-4 bg-green-500/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <h3 class="text-white font-semibold mb-2">Secure</h3>
                    <p class="text-white/70 text-sm">Password protected with bcrypt encryption</p>
                </div>
                
                <div class="glass rounded-2xl p-6 text-center transform hover:scale-105 transition-all duration-300">
                    <div class="w-12 h-12 mx-auto mb-4 bg-green-500/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path>
                        </svg>
                    </div>
                    <h3 class="text-white font-semibold mb-2">Simple</h3>
                    <p class="text-white/70 text-sm">Easy sharing with unique links</p>
                </div>
                
                <div class="glass rounded-2xl p-6 text-center transform hover:scale-105 transition-all duration-300">
                    <div class="w-12 h-12 mx-auto mb-4 bg-green-500/20 rounded-full flex items-center justify-center">
                        <svg class="w-6 h-6 text-green-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </div>
                    <h3 class="text-white font-semibold mb-2">Private</h3>
                    <p class="text-white/70 text-sm">Only you control access to your content</p>
                </div>
            </div>

            <!-- Footer -->
            <div class="text-center mt-12 animate-fade-in">
                <p class="text-white/60 text-sm">✨ Powered by ZenLock &copy; 2025 ✨</p>
            </div>
        </div>
    </div>

    <script>
        // Handle paste access form
        document.getElementById('accessForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const input = document.getElementById('pasteInput').value.trim();
            const accessBtn = document.getElementById('accessBtn');
            const accessBtnText = document.getElementById('accessBtnText');
            const accessSpinner = document.getElementById('accessSpinner');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            if (!input) {
                errorText.textContent = 'Please enter a paste ID or URL';
                errorMessage.classList.remove('hidden');
                return;
            }
            
            // Show loading state
            accessBtn.disabled = true;
            accessBtnText.textContent = '🔍 Finding paste...';
            accessSpinner.classList.remove('hidden');
            errorMessage.classList.add('hidden');
            
            // Extract paste ID from input (supports both /view/{id} and /view/index.html?id=...)
            let pasteId = input;

            try {
                const maybeUrl = new URL(input);
                const idParam = maybeUrl.searchParams.get('id');
                if (idParam) {
                    pasteId = idParam;
                } else if (maybeUrl.pathname.includes('/view/')) {
                    pasteId = maybeUrl.pathname.split('/view/')[1].split('/')[0];
                }
            } catch (_) {
                if (input.includes('?id=')) {
                    const params = new URLSearchParams(input.split('?')[1]);
                    pasteId = params.get('id') || pasteId;
                } else if (input.includes('/view/')) {
                    pasteId = input.split('/view/')[1].split('/')[0];
                }
            }

            pasteId = pasteId.split('?')[0].split('#')[0];

            // Redirect to the paste view page (static-safe)
            setTimeout(() => {
                window.location.href = `/view/index.html?id=${encodeURIComponent(pasteId)}`;
            }, 800);
        });

        // Add some interactive effects
        document.querySelectorAll('.glass').forEach(el => {
            el.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-5px)';
            });
            
            el.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });

        // Auto-focus the input field
        setTimeout(() => {
            document.getElementById('pasteInput').focus();
        }, 1000);
    </script>
</body>
</html>
