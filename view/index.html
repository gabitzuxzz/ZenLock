<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Paste - ZenLock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #065f46 0%, #047857 100%);
        }
        .paste-content {
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Discord Link -->
    <div class="absolute top-4 right-4 z-10">
        <a href="https://discord.gg/zenyth" target="_blank" 
           class="flex items-center justify-center w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full transition-all duration-300 backdrop-blur-sm">
            <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515a.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0a12.64 12.64 0 0 0-.617-1.25a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057a19.9 19.9 0 0 0 5.993 3.03a.078.078 0 0 0 .084-.028a14.09 14.09 0 0 0 1.226-1.994a.076.076 0 0 0-.041-.106a13.107 13.107 0 0 1-1.872-.892a.077.077 0 0 1-.008-.128a10.2 10.2 0 0 0 .372-.292a.074.074 0 0 1 .077-.010c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.197.373.292a.077.077 0 0 1-.006.127a12.299 12.299 0 0 1-1.873.892a.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028a19.839 19.839 0 0 0 6.002-3.03a.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.956-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419c0-1.333.955-2.419 2.157-2.419c1.21 0 2.176 1.096 2.157 2.42c0 1.333-.946 2.418-2.157 2.418Z"/>
            </svg>
        </a>
    </div>

    <!-- Back Button -->
    <div class="absolute top-4 left-4 z-10">
        <a href="/" 
           class="flex items-center justify-center w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full transition-all duration-300 backdrop-blur-sm">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
        </a>
    </div>

    <!-- Main Content -->
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="max-w-4xl w-full">
            <!-- Password Form (shown initially) -->
            <div id="passwordForm" class="max-w-md mx-auto">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 mx-auto mb-4 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </div>
                    <h1 class="text-4xl font-bold text-white mb-2">Protected Paste</h1>
                    <p class="text-green-100">Enter the password to view this paste</p>
                </div>

                <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8">
                    <form id="unlockForm" class="space-y-6">
                        <div>
                            <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                            <input type="password" id="password" name="password" required
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent transition-all duration-300"
                                   placeholder="Enter password">
                        </div>

                        <button type="submit" id="unlockBtn"
                                class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-300 flex items-center justify-center">
                            <span id="unlockBtnText">Unlock Paste</span>
                            <div id="unlockSpinner" class="hidden ml-2">
                                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </div>
                        </button>
                    </form>

                    <!-- Error Message -->
                    <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                        <div class="flex">
                            <svg class="w-5 h-5 text-red-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p class="text-sm text-red-700" id="errorText"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Paste Content (shown after successful unlock) -->
            <div id="pasteContent" class="hidden">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 mx-auto mb-4 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                        <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                    </div>
                    <h1 id="pasteTitle" class="text-4xl font-bold text-white mb-2"></h1>
                    <p id="pasteDate" class="text-green-100"></p>
                </div>

                <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-semibold text-gray-800">Content</h2>
                        <button onclick="copyContent()" 
                                class="px-4 py-2 bg-green-600 text-white text-sm rounded-lg hover:bg-green-700 transition-colors flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                            Copy
                        </button>
                    </div>
                    
                    <div class="bg-gray-50 rounded-lg p-6 border">
                        <pre id="pasteText" class="paste-content text-sm text-gray-800"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get paste ID from URL: support both ?id=... and /view/{id}
        const searchParams = new URLSearchParams(window.location.search);
        let pasteId = searchParams.get('id');
        if (!pasteId) {
            const pathMatch = window.location.pathname.match(/\/view\/(.+)$/);
            if (pathMatch && pathMatch[1] && pathMatch[1] !== 'index.html') {
                pasteId = pathMatch[1].split('/')[0];
            }
        }

        if (!pasteId) {
            // No paste ID in URL, redirect to home
            window.location.href = '/';
        }

        // Copy content to clipboard
        function copyContent() {
            const content = document.getElementById('pasteText').textContent;
            navigator.clipboard.writeText(content).then(() => {
                const button = event.target.closest('button');
                const originalHTML = button.innerHTML;
                button.innerHTML = '<svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>Copied!';
                setTimeout(() => {
                    button.innerHTML = originalHTML;
                }, 2000);
            });
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Handle unlock form submission
        document.getElementById('unlockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const unlockBtn = document.getElementById('unlockBtn');
            const unlockBtnText = document.getElementById('unlockBtnText');
            const unlockSpinner = document.getElementById('unlockSpinner');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            // Show loading state
            unlockBtn.disabled = true;
            unlockBtnText.textContent = 'Unlocking...';
            unlockSpinner.classList.remove('hidden');
            errorMessage.classList.add('hidden');

            try {
                // Replace with your backend URL when deploying
                const response = await fetch('https://zenserver.onrender.com/api/getPaste', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ id: pasteId, password }),
                });

                const data = await response.json();

                if (data.success) {
                    // Show paste content
                    document.getElementById('pasteTitle').textContent = data.paste.title;
                    document.getElementById('pasteDate').textContent = `Created on ${formatDate(data.paste.createdAt)}`;
                    document.getElementById('pasteText').textContent = data.paste.content;
                    
                    // Hide password form and show content
                    document.getElementById('passwordForm').classList.add('hidden');
                    document.getElementById('pasteContent').classList.remove('hidden');
                    
                    // Update page title
                    document.title = `${data.paste.title} - ZenLock`;
                } else {
                    // Show error
                    errorText.textContent = data.message || 'Failed to unlock paste';
                    errorMessage.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Unlock error:', error);
                errorText.textContent = 'Connection error. Please try again.';
                errorMessage.classList.remove('hidden');
            } finally {
                // Reset loading state
                unlockBtn.disabled = false;
                unlockBtnText.textContent = 'Unlock Paste';
                unlockSpinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
